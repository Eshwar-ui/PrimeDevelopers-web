<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prime Developers — building the landmarks of Texas since 2017. Iconic commercial and residential real estate across the Dallas–Fort Worth and Austin markets."
    />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Prime Developers — We build the landmarks of Texas</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before first paint so a returning dark-mode visitor never sees a
         white flash while the bundle loads. Kept deliberately tiny and inline;
         anything deferred is already too late. Mirrored by ThemeContext. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('prime-theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode with storage blocked — fall through to the light default */
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
