<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prime Developers — building the landmarks of Texas since 2017. Iconic commercial and residential real estate across the Dallas–Fort Worth and Austin markets."
    />
    <meta name="theme-color" content="#0b1216" />

    <!-- The two remaining third-party origins. Each costs a DNS lookup, TCP
         handshake and TLS negotiation before its first request can be sent;
         warming them here overlaps that setup with the HTML parse instead of
         paying it serially further down. Fonts used to need two more of these
         and are now served from this origin. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />

    <!-- Fonts are discovered inside the CSS, which the browser has to download
         and parse first — so without these the text has to wait two round
         trips. Only the two faces the first screen actually paints in are
         preloaded; the italics and latin-ext subsets stay lazy. -->
    <link
      rel="preload"
      href="/fonts/rubik-latin-300_800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/arimo-latin-400_700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Prime Developers — We build the landmarks of Texas</title>

    <script>
      /**
       * Start the content requests here, in the <head>, rather than waiting for
       * React to mount and run an effect.
       *
       * The site cannot paint until this data arrives, and it used to be
       * requested at ~271ms: after the 169KB bundle had downloaded, parsed, and
       * booted React. Firing it inline moves that to ~10ms and overlaps the
       * round trip with the bundle download entirely — on a slow connection,
       * where the bundle takes seconds, that is the whole of the wait.
       *
       * Purely an optimisation. If anything here fails, `apiFetch` falls back
       * to requesting normally, so the worst case is the behaviour we had.
       */
      (function () {
        // Admins read the /admin endpoints, which include unpublished drafts.
        // Prefetching the public ones for them would be wasted, and worse,
        // could hand the CMS a draft-less list.
        if (location.pathname.indexOf('/admin') === 0) return

        var base = '%VITE_API_BASE_URL%'
        if (!base || base.indexOf('%') === 0) return

        var store = (window.__PD_PREFETCH__ = {})
        ;['/content', '/properties', '/news'].forEach(function (path) {
          var pending = fetch(base + '/api' + path).then(function (res) {
            if (!res.ok) throw new Error('prefetch ' + path + ' → ' + res.status)
            return res.json()
          })
          // The consumer may never arrive (a bot, a fast bounce). Attaching a
          // sink keeps a rejection from surfacing as an unhandled error while
          // leaving `pending` itself rejectable for whoever does claim it.
          pending.catch(function () {})
          store[path] = pending
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before first paint so nobody sees a white flash while the bundle
         loads. Kept deliberately tiny and inline; anything deferred is already
         too late. Mirrored by ThemeContext, and the two must not disagree.

         Dark unless the visitor has explicitly stored light — the site's own
         default, not the operating system's. The catch falls through to dark
         for the same reason: with storage blocked there is no stored choice to
         honour, and dark is what the page is designed as. -->
    <script>
      (function () {
        var dark = true
        try {
          dark = localStorage.getItem('prime-theme') !== 'light'
        } catch (e) {
          /* private mode with storage blocked — keep the default */
        }
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
