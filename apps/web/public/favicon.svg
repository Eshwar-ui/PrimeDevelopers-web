<!-- The logomark only — the "PD" monogram lifted from the brand pack's
     Logomark- Dark Back artwork, paths untouched. The full lockup used to sit
     here, and at 16px the wordmark collapsed into an unreadable smear; the
     monogram is the part that survives the shrink.

     The charcoal tile is not decoration. The D is white, so on a light tab bar
     a transparent version loses half the mark. Painting our own ground means
     the icon reads the same in both browser themes without a media query. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#2F2F2F" />
  <!-- Native mark is 929.04 × 1080. Scaled to 440 tall and centred. The margin
       is deliberately tighter than a logo lockup's safe zone: at 16px every
       pixel spent on padding is a pixel the mark does not get, and the tile
       edge already does the separating that whitespace would. -->
  <g transform="translate(66.75 36) scale(0.407407)">
    <path
      d="M1424.52,540c0,297.76-242.26,540-540,540H739.61V907.64H884.48c202.72,0,367.66-164.93,367.66-367.64S1087.2,172.36,884.48,172.36h-381V0h381C1182.26,0,1424.52,242.24,1424.52,540Z"
      transform="translate(-495.48)"
      fill="#FFFFFF"
    />
    <path
      d="M1200.18,541.9c0,162.42-132.12,294.53-294.55,294.53h-166V685.61h166c79.26,0,143.72-64.46,143.72-143.71S984.89,398.2,905.63,398.2H646.31v669H495.48V247.38H905.63C1068.06,247.38,1200.18,379.49,1200.18,541.9Z"
      transform="translate(-495.48)"
      fill="#0073A4"
    />
  </g>
</svg>
