packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency build scripts unless a package is listed here.
# Prisma's postinstall downloads its query engine — without it, the client is
# never generated and the API cannot start. Kept to an explicit allowlist so
# adding a dependency never silently gains the right to run code on install.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - prisma

# Security fixes the API's dependencies pin out of reach (audit task 5,
# tasks/audit-2026-11-15). @nestjs/platform-express 10.4.22 is the last 10.x
# and pins multer 2.0.2, body-parser 1.20.4 and express 4.22.1 exactly;
# @nestjs/swagger 7.4.2 pins js-yaml 4.1.0 and @nestjs/config 3.3.0 pins lodash
# 4.17.21. Each selector matches only the vulnerable versions on the same major
# line, so it stops applying once upstream moves past it — delete the entry
# then. Moving to Nest 11 would remove most of these.
overrides:
  'multer@<2.1.0': ^2.5.0
  'body-parser@>=1.0.0 <1.20.6': ~1.20.9
  'proxy-addr@>=2.0.0 <2.0.8': ^2.0.8
  'js-yaml@>=4.0.0 <4.3.0': ^4.3.2
  'lodash@<4.18.0': ^4.18.1
