# Render service definition for the Prime Developers API.
#
# The frontend is NOT here — it deploys to Firebase Hosting
# (`pnpm run deploy:web`). This file defines the API only.
#
# Secrets are marked `sync: false`, which means Render prompts for them in the
# dashboard rather than reading them from this file. Never put a real value here.

services:
  - type: web
    name: prime-developers-api
    runtime: node

    # Not `free`. Free services sleep after 15 minutes idle and cold-start in
    # roughly 50 seconds; the public site fetches its content on mount, so the
    # first visitor after a quiet spell would wait most of a minute for a blank
    # page. Starter is the real cost of putting a marketing site behind an API.
    plan: starter

    # The Supabase project is in ap-south-1 (Mumbai) — confirmed from the pooler
    # hostname. Render has no Mumbai region, and Singapore is its nearest, so
    # this is the right choice rather than merely a default. Expect ~50-80ms per
    # database round trip; measured 76ms from here during verification.
    region: singapore

    # Repo root, not apps/api — the pnpm workspace and its lockfile live here,
    # and an install from apps/api alone cannot resolve the workspace.
    rootDir: .

    # No `prisma migrate deploy`. This project has no Prisma migration history:
    # the schema is owned by supabase/migrations/*.sql and applied deliberately,
    # because the database is shared with the construction-management
    # application and a migration runner let loose on it could touch tables that
    # aren't ours. `prisma generate` runs via the api package's prebuild.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @prime-developers/api build

    startCommand: node apps/api/dist/main

    # Liveness, not readiness — a failing database should not make Render tear
    # the instance down and retry, because redeploying fixes nothing if the
    # problem is Supabase. /api/health/ready is for humans and uptime monitors.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production

      # ── Set in the Render dashboard ────────────────────────────────────
      # Supabase → Settings → Database. Pooler (6543) at runtime; the direct
      # connection (5432) only for schema work.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # openssl rand -hex 64
      # Refresh tokens are opaque and stored hashed, so there is no second
      # signing secret.
      - key: JWT_ACCESS_SECRET
        sync: false

      # Supabase → Settings → API. The service-role key bypasses RLS and is
      # what lets the API write to Storage on an admin's behalf. Server only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Non-secret ────────────────────────────────────────────────────
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      # The canonical site. Both hosting sites live in the same Firebase
      # project; theprimedeveloper is the one that carries the brand name and
      # the one deploys now go to.
      - key: FRONTEND_URL
        value: https://theprimedeveloper.web.app
      # Comma-separated. Firebase serves each site on two default domains and a
      # request from the one that isn't listed fails CORS with a message that
      # points at the browser rather than at this setting — so list both of
      # each.
      #
      # theprime-construction is still here on purpose: it is no longer
      # deployed to, but it keeps serving its last build until the site is
      # deleted, and dropping it from this list would break that copy
      # immediately rather than letting it retire quietly. Remove the second
      # pair once the site is gone.
      - key: CORS_ORIGINS
        value: https://theprimedeveloper.web.app,https://theprimedeveloper.firebaseapp.com,https://theprime-construction.web.app,https://theprime-construction.firebaseapp.com
